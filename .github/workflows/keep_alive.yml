name: Keep Streamlit App Awake

on:
  schedule:
    # Runs twice a day (at 6:00 AM and 6:00 PM UTC)
    - cron: "0 6,18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -L -s -o /dev/null -w "%{http_code}\n" "https://lone-wolf.streamlit.app"
